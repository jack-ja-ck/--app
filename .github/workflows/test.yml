name: E2E Test
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright
      - run: npx playwright install chromium
      - run: node .github/scripts/run-e2e.cjs
      
      # 下面这行是新增的，记得保留
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshot
          path: screenshot.png
